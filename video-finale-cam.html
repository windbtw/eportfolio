<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Finale CAM - Martin Cornillad</title>
    <meta name="description" content="Video finale CAM - page temporaire.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        .temp-badge {
            display: inline-block;
            background: #ff3860;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-links a.nav-highlight {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            background: linear-gradient(135deg, #ff3860, #ff8a00);
            color: #fff !important;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 56, 96, 0.4);
            animation: pulse-highlight 2s ease-in-out infinite;
        }
        .nav-links a.nav-highlight .temp-badge {
            background: #fff;
            color: #ff3860;
            margin-left: 0;
        }

        @keyframes pulse-highlight {
            0%, 100% { box-shadow: 0 4px 12px rgba(255, 56, 96, 0.4); }
            50% { box-shadow: 0 4px 20px rgba(255, 138, 0, 0.7); }
        }

        .split-page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        @media (max-width: 900px) {
            .split-page { grid-template-columns: 1fr; }
        }

        .split-panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .split-panel h3 {
            margin-bottom: 1rem;
            color: var(--accent-hover);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .panel-header h3 { margin-bottom: 0; }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff !important;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
        }
        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(157, 78, 221, 0.45);
            color: #fff !important;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-wrapper iframe,
        .video-placeholder {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: linear-gradient(135deg, #16213e, #0f3460);
            font-style: italic;
            text-align: center;
            padding: 1rem;
        }

        .a4-wrapper {
            width: 100%;
            aspect-ratio: 559 / 794;
            background: #0a0a0f;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .a4-wrapper img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .a4-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 559px;
            height: 794px;
            border: 0;
            transform-origin: top left;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">Martin Cornillad</div>
                <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
                    ☰
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Welcome</a></li>
                    <li><a href="engineering.html">Engineering Course</a></li>
                    <li><a href="mobility.html">International Mobility</a></li>
                    <li><a href="sustainability.html">Sustainability</a></li>
                    <li><a href="career.html">Career Development</a></li>
                    <li><a href="hobbies.html">Hobbies</a></li>
                    <li><a href="video-finale-cam.html" class="nav-highlight active">Video Finale CAM <span class="temp-badge">Temp</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Video Finale CAM</h1>
                <p style="color: var(--text-muted); font-style: italic;">Page temporaire</p>

                <div class="split-page">
                    <div class="split-panel">
                        <h3>Vidéo Finale CAM</h3>
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/_AYgpk_D5UM"
                                    title="Video Finale CAM"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowfullscreen></iframe>
                        </div>
                    </div>

                    <div class="split-panel">
                        <div class="panel-header">
                            <h3>Fiche (A4) — Mobility Roadmap</h3>
                            <button type="button" class="download-btn" id="download-poster" title="Télécharger en PNG">
                                ⬇ Download
                            </button>
                        </div>
                        <div class="a4-wrapper">
                            <iframe src="assets/mobility_poster.html"
                                    title="Mobility Roadmap UQAC"
                                    scrolling="no"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Martin Cornillad. All rights reserved.</p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/martin-cornillad/" target="_blank"
                    rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
        (function () {
            const wrapper = document.querySelector('.a4-wrapper');
            const frame = wrapper && wrapper.querySelector('iframe');
            if (!frame) return;
            const fit = () => {
                const scale = wrapper.clientWidth / 559;
                frame.style.transform = `scale(${scale})`;
            };
            new ResizeObserver(fit).observe(wrapper);
            fit();

            const btn = document.getElementById('download-poster');
            if (!btn) return;
            btn.addEventListener('click', async () => {
                const originalLabel = btn.textContent;
                btn.disabled = true;
                btn.textContent = '⏳ Génération...';
                try {
                    const doc = frame.contentDocument;
                    if (!doc || !doc.body) throw new Error('Iframe inaccessible');
                    const canvas = await html2canvas(doc.body, {
                        backgroundColor: '#0a0a0f',
                        width: 559,
                        height: 794,
                        scale: 3,
                        useCORS: true,
                    });
                    const link = document.createElement('a');
                    link.download = 'mobility_poster.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    console.error(err);
                    alert('Échec du téléchargement : ' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = originalLabel;
                }
            });
        })();
    </script>
</body>

</html>
